name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  build_docker_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: install checkout
        uses: actions/checkout@v7

      - name: check version docker
        run: |
          docker -v
          docker compose version

      - name: docker up
        run: docker compose up -d

      - name: install dependencies
        run: docker compose exec -T -w /front/front node npm ci

#      - name: run test
#        run: docker compose exec -T -w /front/front node npm test -- --ci --passWithNoTests #pas nécessaire car npm fait les test dans le build

      - name: build app
        run: docker compose exec -T -w /front/front node npm run build

      - name: stop docker
        if: always()
        run: docker compose down

  check_image_docker:
    needs: build_docker_and_test
    runs-on: ubuntu-latest

    steps:

#      - name: login to docker hub
#        uses: docker/login-action@v3
#        with:
#          username: ${{ secrets.DOCKER_USERNAME }}
#          password: ${{ secrets.DOCKER_PASSWORD }}

#      - name: Docker scout
#        uses: docker/scout-action@v1
#        with:
#          command: cves
#          image: postgres:18-alpine3.24
#          to: postgres:latest
#          ignore-unchanged: true
#          only-unfixed: true

      - name: trivy - scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: node:26-alpine3.24
          format: 'table'
          exit-code: 0
          ignore-unfixed: 'false'
          severity: 'HIGH,CRITICAL'

  renovate:
    needs: check_image_docker
    runs-on: ubuntu-latest

    steps:
      - name: check docker compose renovate
        uses: renovatebot/github-action@v46.2.0
        env:
          LOG_LEVEL: "warn"
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: "agachot/next_ci_cd_2_06-2026"
